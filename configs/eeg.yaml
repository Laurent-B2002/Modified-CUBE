timesteps: [0,250]

blur_kernel_size: 51
system_g: 3

name: "${dataset}_${exp_setting}_ubp_${brain_backbone}"

models:
  brain:
    target: "base.eeg_backbone.${brain_backbone}"
    params:
        c_num: 17 #63
        z_dim: ${z_dim}
        timesteps: ${timesteps}

data:
  data_dir: data/Preprocessed_data_250Hz_whiten/ #pilot/cube_ready/
  selected_ch: ['P7', 'P5', 'P3', 'P1','Pz', 'P2', 'P4', 'P6', 'P8', 'PO7', 'PO3', 'POz', 'PO4', 'PO8','O1', 'Oz', 'O2'] #"None"
  model_type: 'REMOVE'
  train_batch_size: 1024
  val_batch_size: 200
  test_batch_size: 200
  uncertainty_aware: True #False
  blur_type:
    target: base.utils.DirectT # base.inpainting_data.FoveaBlur 
    params:
          #{}
          blur_kernel_size: 51
          # h: 224
          # w: 224
          # blur_kernel_size: ${blur_kernel_size}
          # curve_type: exp
          # system_g:  ${system_g}

  train_avg: True
  test_avg: True
  timesteps: ${timesteps}

train:
  epoch: ${epoch}
  optimizer: AdamW
  lr: ${lr}

save_dir: 'exp_eeg'
